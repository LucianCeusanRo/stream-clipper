# ============================================================
#  STREAM CLIPPER - settings (edit the values only)
#  setup.bat copies this file to config.yaml. config.yaml stays on your PC (it is in .gitignore).
#  Most of these can also be changed in the app: Settings tab.
# ============================================================

# --- LANGUAGE --------------------------------------------------
language: "en"                    # speech language for Whisper: en, ro, es, de, fr, pt, ... or "auto" (detect)
ui_language: "en"                 # dashboard language: en / ro

# --- SOURCE ----------------------------------------------------
# YouTube channel to watch (empty = no automatic watching; you can still generate clips from any link in the app).
# Clip ONLY creators who allow it or run a clipping campaign. Always credit them.
channel_url: ""
streamer_name: ""                 # used in hooks/titles (empty = "the streamer")
game: ""                          # optional default game; the real game is detected from the stream (Twitch/Kick/YouTube category)
                                  # and used in titles/hashtags only, never on the video. Empty + unknown game = neutral #gaming #clips
extra_urls: []                    # extra lives/VODs to process at start-up (optional)
check_live_every_sec: 60          # how often to check whether a new live started
channel_check_every_sec: 90       # Kick/Twitch channels under Channels: how often each one is checked (30-3600)
backfill_from_start: true         # also process what was already streamed before the app noticed the live
backfill_max_hours: 12            # how far back (YouTube keeps ~12 h of DVR at most)
process_recent_vods: 0            # how many recent finished streams to process at start-up
live_title_filter: ""             # regex, e.g. "(?i)cs2" = only lives with "CS2" in the title ("" = all)
vod_max_hours: 12                 # limit for one VOD
chunk_minutes: 5                  # processing chunk length
video_max_height: 1080            # 1080 or 720

# If YouTube says "Sign in to confirm you're not a bot":
#   put the browser you're logged into YouTube with: chrome / edge / firefox (Chrome must be closed)
#   or a path to a cookies.txt file in youtube_cookies_file. Never share or commit cookie files.
youtube_cookies_from_browser: ""
youtube_cookies_file: ""

# --- TRANSCRIPTION ---------------------------------------------
whisper_model: "auto"             # auto -> small (int8); large-v3-turbo on an NVIDIA GPU in normal memory mode / or large-v3, medium, small, base, tiny
whisper_device: "auto"            # auto / cuda / cpu
whisper_compute_type: "auto"      # auto -> int8 on CPU, int8_float16 on GPU (low RAM/VRAM, same words in practice)
initial_prompt: "live stream, chat."   # names/words Whisper should know (add the streamer's name)

# --- MOMENT SELECTION ------------------------------------------
clip_min_sec: 15
clip_max_sec: 45
clip_target_sec: 30
clips_per_chunk_max: 3            # max moments per 5 minutes of stream
min_score: 0.9                    # threshold (lower = more clips)
min_gap_between_clips_sec: 20     # clips don't overlap
extra_keywords: []                # your own words that mark a good moment, e.g. ["clutch", "headshot", "no way"]
use_llm: true                     # only used if you set an LLM in .env (see README)
llm_min_score: 5                  # 0-10, moments the LLM rates below this are dropped
llm_fix_transcript: true          # the LLM fixes obvious transcription mistakes before captions

# --- RENDERING -------------------------------------------------
layout: "split"                   # split = webcam on top + game below ; blur = whole frame on a blurred background ; fill = centre crop
auto_cam: true                    # find the streamer's face; no webcam -> blur layout automatically
cam_box: [0.0, 0.118, 0.238, 0.238]   # usual webcam area (x, y, width, height as fractions of the 16:9 frame)
encoder: "auto"                   # auto -> h264_nvenc if it works, otherwise libx264
caption_font: "Montserrat Black"  # bundled: Montserrat Black, Anton, Bebas Neue, Archivo Black, Poppins Black, Bangers
caption_size: 108
caption_words_per_line: 3
hook_seconds: 2.5
overlay_texts: false              # extra on-video text such as "Wait for it…". Off = captions are ONLY the words the streamer says
credit_text: ""                   # e.g. "@channel on YouTube" (recommended: credit the creator)
censor_swears: true               # swear words show as *** in captions (the audio is unchanged)

# --- TIKTOK POSTING (optional) ---------------------------------
auto_post: false                  # false = you press "Post" on every clip; true = posts the best ones by itself
manual_min_gap_minutes: 3         # minimum gap between two clips you approved
required_hashtag: ""              # optional, e.g. required by a clipping campaign; always the FIRST hashtag
hashtags: []                      # always added (the game's own hashtag, e.g. #CS2, is added automatically; unknown game = #gaming #clips)
extra_hashtags: ["#gaming", "#clips", "#streamer"]   # a few are picked at random for variety
hashtags_max: 5                   # total hashtags per clip (including required_hashtag)
recut_sources_max_gb: 15          # disk space for the sources used by "Re-cut" (oldest are deleted)
caption_template: "{title} {hashtags}"
post_interval_min_minutes: 20     # minimum gap between automatic posts ("Normal" pace)
post_interval_max_minutes: 30     # maximum gap (random between min and max)
post_jitter_minutes: 4            # +/- a few random minutes so posts do not look scheduled
post_preset: "normal"             # safe (20/day, 40-60 min) / normal (45/day, 20-30 min) / aggressive (60/day, 15-20 min)
daily_post_cap: 45                # max posts per day (higher = more risk of being limited by TikTok)
rotate: true                      # clips without a chosen account take turns over the accounts (round-robin, each account's
                                  # own daily cap + minutes between posts respected, never the same clip twice on one account).
                                  # false = they all go to the first enabled account
rotate_accounts: []               # account ids that take part in the rotation; empty = every enabled account marked "rotation"
quiet_hours: []                   # e.g. [3, 4, 5, 6] = no automatic posts between 03:00 and 06:59
post_order: "viral_first"         # viral_first = highest viral chance first; newest_first = newest first
auto_post_min_viral: 40           # auto-post only posts clips with viral chance >= 40% (clips you approve with Post always go)
dedupe_similarity: 0.8            # clips with almost the same words (>= 80%) are not made / posted twice
visibility: "public"              # public / private (for testing)
browser_channel: "chrome"         # chrome / msedge / chromium
headless: false                   # keep false: TikTok blocks hidden browsers more often

# --- APP -------------------------------------------------------
dashboard_port: 8777              # the app opens at http://127.0.0.1:8777

# --- EFFECTS (also in the app: Settings -> Effects) ------------
effects:
  emoji: true          # emoji next to captions (Twemoji, CC-BY 4.0)
  pop: true            # the spoken word bounces
  keyword_color: true  # colour for keywords (red = rage, green = laughter ...)
  zoom: true           # punch-in on screams / big moments
  shake: true          # light shake on rage
  boost: true          # louder audio on big moments (limiter + -14 LUFS, no distortion)
  boost_db: 4.0
  sfx: true            # meme sounds on peaks (synthesized by this project -> no copyright issues)
  sfx_volume: 0.45
  progress_bar: false  # progress bar at the bottom

# --- disk & cleanup ---
delete_after_post: false          # delete the video file N days after it was posted (thumbnail + link stay)
delete_after_post_days: 1
keep_raw_chunks_hours: 0          # 0 = raw stream chunks are deleted right after processing
skipped_retention_days: 7         # skipped clips are deleted from disk after N days (0 = never)
disk_budget_gb: 150               # max GB for the data folder; above it, oldest/posted files go first (0 = no limit)

# --- updates ---
auto_update: true                 # at every start: install the newest official GitHub release (SHA-256 checked)
check_updates: true               # show "update available" in the app

# ---------- General settings (also in the app: Settings -> General / Performance) ----------
max_parallel_renders: 1           # clips rendered at the same time (1-4). >1 only helps on strong PCs
memory_mode: auto                 # auto = "low" on PCs with less than 12 GB RAM. low = small Whisper model in int8, one clip
                                  # at a time, fewer threads. normal = bigger model on a GPU (large-v3-turbo, int8_float16)
ram_cap_gb: 0                     # 0 = no cap. Above it the idle speech model is freed and new chunks wait a bit
model_idle_unload_minutes: 10     # free the speech model from RAM after this many idle minutes (0 = keep it loaded)
theme: "dark"                     # dark / light
start_with_windows: false         # Windows only (current user, no admin)
minimize_to_tray: false           # the X hides the window to the tray, clipping continues (Windows, applies on next start)
notifications: true               # in-app (and tray) notifications: clip ready, posted, problems
onboarded: false                  # false = show the first-run wizard

# ---------- YouTube Shorts (optional) ----------
# Your OWN Google OAuth client (Google Cloud Console -> Credentials -> OAuth client ID -> Desktop app, with the
# YouTube Data API v3 enabled). Keep the JSON file OUTSIDE this folder; tokens are saved in data/accounts/<id>/.
# Empty = YouTube accounts work in "export" mode (clip + title/description copied for a manual upload).
youtube_client_secret: ""
