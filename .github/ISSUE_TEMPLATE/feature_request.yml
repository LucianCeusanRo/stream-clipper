name: Feature request
description: An idea to make clipping better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: checkboxes
    id: respect
    attributes:
      label: Respect creators
      options:
        - label: This feature still works with the "clip with permission, always credit" defaults.
          required: true
