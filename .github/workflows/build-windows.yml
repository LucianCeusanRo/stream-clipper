name: Build Windows launcher
# Tag vX.Y.Z (= version.txt) -> builds the launcher exe + installer, runs the tests and publishes a GitHub release
# with the files the in-app updater needs: StreamClipper-update-vX.Y.Z.zip + SHA256SUMS.txt.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build launcher exe (icon + version info)
        shell: cmd
        run: |
          python -m pip install ziglang
          cd launcher
          python -m ziglang cc -target x86_64-windows-gnu -O2 -s -municode -Wl,--subsystem,windows launcher.c launcher.rc -o "..\Stream Clipper.exe" -lshell32 -luser32 -ladvapi32
      - name: Tests + smoke test before release (install deps CPU-only, unit tests, full pipeline + web routes)
        shell: cmd
        run: |
          choco install ffmpeg -y --no-progress
          python -m pip install -r requirements.txt
          python -m streamclip selftest --quick || exit /b 1
          python -m streamclip smoke || exit /b 1
      - name: Package update zip + installer
        shell: bash
        run: |
          set -euo pipefail
          VER=$(tr -d '\r\n ' < version.txt)
          echo "VER=$VER" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VER" ]]; then
            echo "tag $GITHUB_REF_NAME does not match version.txt ($VER)"; exit 1; fi
          mkdir -p dist
          git archive --format=tar --prefix=stream-clipper/ HEAD | tar -x
          cp "Stream Clipper.exe" stream-clipper/
          python -m zipfile -c "dist/StreamClipper-update-v$VER.zip" stream-clipper/
          mv stream-clipper stage
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [[ ! -f "$ISCC" ]]; then choco install innosetup -y --no-progress; fi
          "$ISCC" "//DAppVersion=$VER" installer/StreamClipper.iss
          cp "dist/StreamClipper-Setup-v$VER.exe" dist/StreamClipper-Setup.exe     # stable name for the README/website link
          cd dist && sha256sum StreamClipper-update-v$VER.zip StreamClipper-Setup-v$VER.exe StreamClipper-Setup.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Installer test (silent install as admin -> setup steps, elevated scheduled task, imports)
        shell: pwsh
        run: |
          $p = Start-Process "dist\StreamClipper-Setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!model,!browser,!desktopicon','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; throw "installer exit code $($p.ExitCode)" }
          schtasks /query /tn "Stream Clipper" /xml | Select-String "HighestAvailable","Stream Clipper.exe"
          if ($LASTEXITCODE -ne 0) { Get-Content install.log -Tail 80; throw "elevated task missing" }
          $app = "$env:LOCALAPPDATA\Programs\Stream Clipper"
          if (!(Test-Path "$app\.venv\Scripts\python.exe")) { Get-Content install.log -Tail 80; throw ".venv missing" }
          & "$app\.venv\Scripts\python.exe" -c "import streamclip.app, streamclip.channels, streamclip.memory; print('imports ok')"
          if ($LASTEXITCODE -ne 0) { throw "import failed" }
          (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem").LongPathsEnabled
      - uses: actions/upload-artifact@v4
        with:
          name: Stream-Clipper
          path: dist/*
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=.github/release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else   # one step, so "latest" never shows up without the updater files
            gh release create "$GITHUB_REF_NAME" dist/* --title "Stream Clipper $GITHUB_REF_NAME" --notes-file "$NOTES"
          fi
